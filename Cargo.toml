[package]
name = "pop_var_caller"
version = "0.1.0"
edition = "2024"
license = "MIT"
# Mi22: edition 2024 requires ≥ 1.85; the `let-chains` features
# (e.g. `if let ... && ...` in header.rs) are stable since 1.88, which
# was the floor until 2026-08-25.
#
# **Raised to 1.98 with the pin bump**, because the bump was made in
# order to *use* what 1.98 added — `f64::algebraic_add` and its
# siblings in the likelihood and EM reductions, among others — and a
# floor below the features the code uses is a claim that does not hold.
# `rust-toolchain.toml` pins 1.98.0 for benchmark reproducibility; this
# says which compiler the source actually needs. The two now coincide,
# so CI's MSRV job duplicates the main build until the pin next moves
# ahead of the floor again.
rust-version = "1.98"

[lints.rust]
# Mi23: pin the unsafe-free policy via the lint table so editor LSPs
# and CI builds see the same stance. `src/lib.rs` also carries
# `#![forbid(unsafe_code)]` for redundancy.
unsafe_code = "forbid"

[lints.rustdoc]
# Doc warnings escalate to errors so a broken intra-doc link can't
# silently land.
broken_intra_doc_links = "deny"
# Several `pub(crate)` types (e.g. `IngestState`, `WriterScratch`,
# `ColumnPayload`) appear in doc comments on public items but are
# not re-exported. Allow the lint — the crate is internal-only.
private_intra_doc_links = "allow"

[lints.clippy]
# Mi23: keep the lints table small and additive. `wildcard_enum_match_arm`
# and `match_same_arms` would surface many pre-existing non-PSP
# sites. Re-enable when those modules get their own clippy pass.
fallible_impl_from = "warn"
fn_params_excessive_bools = "warn"
# cohort_block review M4 (Wave 3): `ChunkDriverError` carries `PathBuf`
# + operation-context fields + a nested `VcfWriteError` / `PspReadError`
# per variant so the operator-facing message names *what* the driver
# was doing when the error fired (review §M4). The result is an
# `Err`-arm wider than clippy's default 128-byte threshold; the
# alternative is wrapping every typed-error inner field in `Box<…>`,
# which pays a heap allocation per error and breaks the `#[source]`
# chain anyhow-style rendering. Allow this lint cohort-wide — the
# cost lives only on error paths and the diagnostic value is the
# whole point.
result_large_err = "allow"

# Two lints 1.98's clippy added, both of which fire almost entirely inside the
# frozen production caller (`src/var_calling/`, `src/vcf/`, `src/genetics.rs`),
# which is not edited — see `src/ng/mod.rs`'s freeze paragraph. Nine of the
# twelve `chunks_exact` sites are production's, and two of them sit under
# comments explaining that the constant chunk size is what removes the bounds
# check from the EM inner loop; rewriting those to `as_chunks` would be a
# change to code whose whole value right now is that it does not change.
#
# `as_chunks::<N>()` is the better form and is stable from 1.98 — prefer it in
# new ng code even though the lint no longer asks for it. Drop both `allow`s
# when production is retired.
chunks_exact_to_as_chunks = "allow"
manual_slice_fill = "allow"

[profile.release]
lto = "fat"
codegen-units = 1
debug = "line-tables-only"
panic = "abort"

[profile.bench]
inherits = "release"
debug = true

# **The test suite is a numerical workload, and unoptimised it costs fifteen
# minutes.** `ng::parameter_estimation::joint` alone is essentially the whole
# suite — 190 tests, each a search or a maximisation over a count table, because
# that module has no parity oracle and no legible fixture, so its check is the
# estimator's bias computed exactly. Measured 2026-08-24: that module ran in
# 926.5 s at `opt-level = 0` and **26.1 s at 2**, and the whole library went from
# 897 s to 57 s. A one-line change against a thirty-five-fold difference.
#
# **`debug-assertions` and `overflow-checks` stay on**, since cargo leaves them
# at the `dev` default here — which this project needs, because it deliberately
# holds structural assertions in release and has gates that compare the two
# profiles.
#
# **The cost is compile time on a clean build**, which the container pays more
# often than a host checkout does. `opt-level = 1` was measured too and is the
# worse trade: 71 s of execution against 57 s.
[profile.test]
opt-level = 2

# Symbolised heap/CPU profiling: release-like codegen but with full debug
# info and without fat-LTO frame collapsing, so dhat backtraces resolve to
# `pop_var_caller::` source sites (line-tables-only release builds don't).
[profile.profiling]
inherits = "release"
lto = false
codegen-units = 16
debug = true

# Soak runs: release-speed walks with the assertions still armed.
#
# `[profile.release]` deliberately leaves `debug-assertions` off, so a randomised
# soak run — which is the only thing that walks millions of records — proves the
# two walkers *diverge* in the same places and proves nothing about the
# invariants the code asserts along the way. Those are not decoration: the port's
# own history includes a `debug_assert!` that turned out reachable on a legal read
# stream, silently wrong in release and caught only because a debug run panicked.
#
# So the soak gets its own profile rather than arming the shipping binary, whose
# hot loops would pay for checks the caller cannot act on. `overflow-checks` is on
# for the same reason the assertions are: this walker is dense with `as` casts and
# saturating arithmetic over coordinates, and a wrap there is a wrong number
# rather than a crash. Fat LTO is dropped because a soak is a correctness run, not
# a measurement — link time is the dominant cost otherwise.
#
#     PVC_PARITY_CASES=5000 cargo test --profile soak --lib ng::locus_generation::pileup::parity
#
# Host-native: `scripts/dev.sh` forwards only `CARGO_TARGET_DIR` and `HOME`, so
# `PVC_PARITY_CASES` does not reach the container and a soak run through it
# silently walks the default case count in under a second.
[profile.soak]
inherits = "release"
lto = false
codegen-units = 16
debug-assertions = true
overflow-checks = true

[dependencies]
ahash = "0.8.12"
anyhow = "1.0.102"
# `arrow-array` / `arrow-schema`: the in-memory column batches ng's repeat
# catalog is written from and read into (doc/devel/ng/spec/repeat_catalog.md
# §3.5). Promoted from transitive (via `parquet`'s `arrow` feature) to
# explicit because ng names their types directly, and a transitive
# re-export surface can shrink at any minor bump. Same version as
# `parquet`: the arrow-rs crates release together.
arrow-array = "59.2"
arrow-schema = "59.2"
# bytemuck: zero-copy `cast_slice` in PSP's `encode_list_column_csr`
# fast path (src/psp/block.rs). Avoids user-side `unsafe`; single
# dependent call site.
bytemuck = "1"
clap = { version = "4", features = ["derive"] }
# crossbeam-channel: bounded MPMC for the re-architected cohort pipeline's
# producer→caller (1→W) hand-off (src/var_calling_new/pipeline.rs).
crossbeam-channel = "0.5"
dhat = { version = "0.3", optional = true }
# libm: `lgamma` for the SFS genotype prior's Dirichlet-multinomial log-priors
# (src/genetics.rs). Rust std has no log-gamma and the crate's `ln_factorial` is
# integer-only; the prior's concentration `α` is non-integer. libm is the
# rust-lang port of musl's libm — zero transitive deps, exact to f64 precision.
libm = "0.2"
md-5 = "0.11"
mimalloc = { version = "0.1", default-features = false, optional = true }
# noodles-bam and noodles-csi are promoted from transitive (via
# noodles-cram / noodles-sam) to explicit so the BAM/CSI symbols
# used by src/bam/* are compile-checked against the manifest
# directly rather than relying on noodles-cram's re-export
# surface (which can shrink at any minor bump).
noodles-bam = "0.89.0"
noodles-bgzf = "0.47.0"
noodles-core = "0.20.0"
noodles-cram = "0.93.0"
noodles-csi = "0.56.0"
noodles-fasta = "0.61.0"
noodles-sam = "0.85.0"
noodles-vcf = "0.88.0"
# `parquet`: the wire format of ng's reference repeat catalog
# (doc/devel/ng/spec/repeat_catalog.md §3.5). Only the Arrow writer/reader
# API and zstd framing are used — the other codecs and `simdutf8` would be
# dead weight, so default features are off. The catalog's two heaviest
# readers touch three of its seven columns, which is what a column store
# buys and a row format cannot.
parquet = { version = "59.2", default-features = false, features = ["arrow", "zstd"] }
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
# Only the experiment binary's `estimate-contamination` writes JSON. Already in the
# lock file through other crates, so it costs no new build.
serde_json = "1"
smallvec = "1.13"
tempfile = "3"
thiserror = "2.0.18"
toml = "1.1"
# `wide`: portable SIMD primitives — AVX2 on x86_64 (production
# server), NEON on aarch64 (Apple Silicon dev laptop). Single
# source for both ISAs. Used by posterior_engine::simd for the
# lane-parallel ln/exp tables.
wide = "1.4"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
zstd = "0.13"

[features]
# Enable in `cargo run --example dhat_pileup --features dhat-heap` to swap
# the global allocator for `dhat::Alloc` and produce `dhat-heap.json`.
# Off by default so production builds carry no dhat code.
dhat-heap = ["dep:dhat"]
# **On by default since 2026-08-19**, so every binary and every
# measurement uses `mimalloc` unless a build says otherwise. It is faster
# *and* smaller here, which is what settled it: the cohort merge on 63
# tomato accessions over 100 kb goes from 333 and 335 ms to 249 and 258 on
# 8 threads and from 451 and 453 to 270 and 270 on one, while the most
# memory the process ever holds falls from 5.66 GB to 5.12 GB and from
# 5.45 to 5.09. The production `var-calling` path had already measured the
# same 9% off peak resident (`src/main.rs`). What it costs is a vendored C
# allocator compiled into every build; `--no-default-features` opts out.
#
# The reason it pays is what the merge does to memory rather than how much
# it uses: it frees far more blocks than it allocates — 6.4 million
# against 216 thousand a round, counted — because the observations it
# walks were allocated upstream and released as it passes them. glibc
# takes an arena lock per free, and those frees are concentrated on one
# thread; mimalloc frees into a per-thread heap without one.
#
# Only one `#[global_allocator]` may exist, so a target that offers both gates
# its mimalloc declaration on `not(feature = "dhat-heap")` and dhat wins when
# both are on. That has to stay a *build* that succeeds, because CI lints and
# tests with `--all-features` (ci.yml:35,47), which enables both. An earlier
# version of this comment claimed enabling both was a compile error; no target
# has ever done that, and one that tried would turn CI red. Where the collision
# matters — a measurement naming one allocator while running another — the
# target refuses at startup instead (`ng_generic_walk_probe`).
alloc-mimalloc = ["dep:mimalloc"]
# `alloc-mimalloc` is the default; `dhat-heap` is not, and a heap profile
# needs `--no-default-features --features dhat-heap` so that mimalloc is
# not also asked for. Targets offering both already gate their mimalloc
# declaration on `not(feature = "dhat-heap")`, so asking for both still
# *builds* — which `--all-features` in CI requires — and dhat takes the
# slot.
default = ["alloc-mimalloc"]
# Compile the joint fit's drawn-evidence generators — `ssr_fit::bench_fixtures`
# (a stratum drawn at a known slippage) and `fit::bench_fixtures` (a cohort drawn
# at a known error rate, heterozygosity and inbreeding) — outside `cfg(test)`, so
# `benches/ng_joint_fit_perf.rs` can time the real `fit_stratum` / `fit_strata` /
# `fit_jointly` on evidence that needs no CRAM and no reference genome.
#
# **The generators are the ones the module's own positive controls draw from**, not
# copies: a benchmark drawn differently from the oracle would be timing a workload
# no test has ever checked. Off by default so a release build compiles none of it.
#
#     cargo bench --features bench-fixtures --bench ng_joint_fit_perf
bench-fixtures = []
# Compile the cohort merge's stopwatches (`src/ng/run/cohort_merge/timing.rs`), so a
# probe can ask a merge where its own wall time went: drawing the readers forward,
# evicting, the builders' own work, the wait for each round's slowest builder, and
# what launching them costs.
#
# **Off by default because timing in the hot path is itself a change to what is being
# measured.** Without the feature every counter is a zero-sized type whose methods are
# empty, so the merge's source reads the same in both builds and the timed build is
# the only one that reads a clock.
#
#     cargo run --release --features merge-timing --example ng_cohort_merge_real_cost
merge-timing = []

[dev-dependencies]
bstr = "1"
criterion = "0.8.2"
proptest = "1"
serial_test = "3"

[[bin]]
name = "pop_var_caller"
path = "src/main.rs"

# The ng experiment binary: ng's command surface, kept separate from the
# production `pop_var_caller` CLI so ng's experiment knobs never grow it
# (see doc/devel/ng/spec/typed_regions_cli.md §2). Same crate, same library.
[[bin]]
name = "pop_var_caller_exp"
path = "src/main_exp.rs"

[[bench]]
name = "pileup_walker_scaling"
harness = false

[[bench]]
name = "freebayes_bookkeeping"
harness = false

[[bench]]
name = "baq_perf"
harness = false

[[bench]]
name = "psp_writer_perf"
harness = false

[[bench]]
name = "psp_reader_perf"
harness = false

[[bench]]
name = "cohort_var_calling_perf"
harness = false

[[bench]]
name = "paralog_scoring_perf"
harness = false

[[bench]]
name = "ng_ssr_delimiter_perf"
harness = false

[[bench]]
name = "ng_generic_pileup_perf"
harness = false

# ng's psp store: a full walk, a head-only walk, a one-in-a-hundred walk, and a write.
[[bench]]
name = "ng_psp_perf"
harness = false

# The joint parameters fit. Needs `--features bench-fixtures` to measure anything;
# without it the target still builds (so `cargo bench --no-run` covers it) and
# refuses at startup rather than reporting a time for a fixture it could not draw.
# `required-features` is deliberately not used: it would make the target invisible
# to a plain `cargo bench --no-run`, which is where a bench that stopped compiling
# gets caught.
[[bench]]
name = "ng_joint_fit_perf"
harness = false


# The generic walk probe carries its own tests: it is the instrument spec §11 makes every
# alignment-cursor milestone answer to, so its guards must run where a developer will see
# them, not only in CI.
#
# What this entry buys, measured rather than assumed. `--examples` (which CI runs,
# ci.yml:47) and `--all-targets` already run every example's tests, with or without it.
# What they do *not* cover is a plain `cargo test`, which is the command a developer
# actually types — and `--all-targets` is no substitute, because it also launches the
# criterion benches. `test = true` adds this one example to the default selection.
[[example]]
name = "ng_generic_walk_probe"
test = true

# The head-encoding harness carries its own tests for the same reason: it produced the
# measurement that closed arch §7's open question about the record head's encoding, and the
# fixed-width arm it compares against has no other oracle. `test = true` puts them in a plain
# `cargo test`, which is the command a developer types.
[[example]]
name = "ng_psp_head_encoding"
test = true

# The parity harness carries its own tests because the one thing it cannot show by passing is
# that it is able to fail: it reports a clean run over millions of records, and a comparison that
# had quietly stopped looking at a field would report exactly the same thing. Its tests change one
# field at a time and require the refusal. `test = true` puts them in a plain `cargo test`.
[[example]]
name = "ng_psp_parity"
test = true

# The open-cost harness carries a test on the one piece of logic it has: which field of
# `/proc/self/status` the peak is read from. `VmHWM` and `VmRSS` differ by three characters and
# by everything that matters, and reading the wrong one turns the measurement into noise.
[[example]]
name = "ng_psp_open_cost"
test = true

# The skip-value harness carries a test on its one piece of logic: that a reading is the cheapest
# of its rounds rather than the first or the mean. A noisy round would otherwise move the ratio
# the whole step turns on.
[[example]]
name = "ng_psp_skip_value"
test = true

# The thin-stratum gate draws its strata from `ssr_fit::bench_fixtures`, which exists
# only under `cfg(test)` or the `bench-fixtures` feature. Without this entry a plain
# `cargo test` — which builds every example — fails to compile the crate at all.
#
# The `ng_joint_fit_perf` bench above deliberately avoids `required-features` so that
# `cargo bench --no-run` still catches it going stale. That trade is not available
# here: this example *names* the gated module in a `use`, so there is no version of it
# that compiles without the feature and refuses at startup instead.
[[example]]
name = "ng_ssr_thin_stratum_gate"
required-features = ["bench-fixtures"]

# The site quality's cost across the cohort sizes the caller commits to —
# `doc/devel/ng/spec/calling_quality.md` §13's Q3, which names this benchmark as the way to
# settle it. It draws its own likelihood table, so it needs no fixture feature and
# `cargo bench --no-run` keeps it from going stale.
[[bench]]
name = "ng_site_quality_perf"
harness = false
