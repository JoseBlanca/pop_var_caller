# **Transcendental maths goes through `crate::float`, never std's methods.** std's `f64::ln`,
# `exp`, `powf` and the rest call the operating system's maths library, which rounds differently
# on macOS and Linux, and a unit in the last place is enough to flip a tie in the caller's output.
# `src/float.rs` computes the same functions in Rust (the libm crate), so they give the same bits
# everywhere; see its module documentation and doc/devel/implementation_plans/portable_float.md.
#
# `powi` is here too: at run time std's gives the loop's bits, but with literal operands the
# compiler computes it using the build machine's `pow`. `sqrt`, `abs` and the basic arithmetic are
# rounded exactly by IEEE 754 and stay allowed. `scripts/check_float_ban.sh` proves every entry
# still refuses its method: clippy ignores a misspelled path without a word.
#
# Examples are research tools outside this guarantee and allow the lint file by file;
# `src/float.rs`'s tests allow it to compare against std on purpose.
disallowed-methods = [
    { path = "f64::ln", reason = "use crate::float::ln: std's may round differently on each platform" },
    { path = "f64::log", reason = "use crate::float::ln / log10: std's may round differently on each platform" },
    { path = "f64::log2", reason = "add it to crate::float: std's may round differently on each platform" },
    { path = "f64::log10", reason = "use crate::float::log10: std's may round differently on each platform" },
    { path = "f64::ln_1p", reason = "use crate::float::ln_1p: std's may round differently on each platform" },
    { path = "f64::exp", reason = "use crate::float::exp: std's may round differently on each platform" },
    { path = "f64::exp2", reason = "add it to crate::float: std's may round differently on each platform" },
    { path = "f64::exp_m1", reason = "use crate::float::exp_m1: std's may round differently on each platform" },
    { path = "f64::powf", reason = "use crate::float::powf: std's may round differently on each platform" },
    { path = "f64::powi", reason = "use crate::float::powi: the compiler folds std's with the build machine's pow" },
    { path = "f64::sin", reason = "use crate::float::sin: std's may round differently on each platform" },
    { path = "f64::cos", reason = "use crate::float::cos: std's may round differently on each platform" },
    { path = "f64::tan", reason = "add it to crate::float: std's may round differently on each platform" },
    { path = "f64::sin_cos", reason = "use crate::float::{sin, cos}: std's may round differently on each platform" },
    { path = "f64::asin", reason = "add it to crate::float: std's may round differently on each platform" },
    { path = "f64::acos", reason = "add it to crate::float: std's may round differently on each platform" },
