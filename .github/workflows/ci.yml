# M18: Continuous-integration gates for the PSP code-review fixes.
# Runs on every push to `main` and on every PR. The job names match
# the verification commands the rust-code-review skill expects.
name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt + clippy + test + doc + audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `rust-toolchain.toml` pins the channel; `dtolnay/rust-toolchain`
      # picks it up automatically.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry / target
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test (lib + integration + examples, excluding criterion benches)
        # `--all-targets` would attempt to run criterion benches which
        # need fixture files not present in CI; the three flags below
        # cover the unit, integration and example suites.
        #
        # `--examples` was added 2026-07-31: the dump tools carry real
        # tests — 32 of them — and `--tests` does not reach them, so the
        # only guards anywhere on the generic dump's per-run witness
        # bound had never run on a pull request (Milestone D reliability
        # review). They cost about 0.03 s.
        run: cargo test --lib --tests --examples --all-features

      - name: Test the calling module under --release (holds its release-only assertions)
        # `src/calling/` is designed with no `Result` anywhere: a caller bug is an
        # assertion, and a good few of those are deliberately held in RELEASE because the
        # failure they prevent is silent — a truncated row scored as a whole one, a `NaN`
        # laundered into a plausible allele frequency. A debug test run cannot tell
        # `assert!` from `debug_assert!`, so the step above verifies none of them.
        #
        # Measured while adding this (2026-08-25): downgrading the six release-held checks
        # in `score_one_sample` to `debug_assert` and running under `--release` fails six
        # tests, one per check. Under the debug run it fails none.
        #
        # SCOPED TO `calling::` ON PURPOSE — the filter selects exactly the `calling`
        # module's tests, 1,167 of them. Crate-wide, `cargo test --release --lib` has 3
        # failures (measured 2026-09-13, after the older caller was deleted and ng's modules
        # moved to the crate root): `alignment::left_align_repeated` and
        # `alignment::left_align_structured`'s `an_offset_past_the_reference_panics`, and
        # `genetics::tests::lgamma_panics_on_non_positive_in_debug` — `#[should_panic]`
        # tests on checks that are debug-only by design and lack
        # `#[cfg(debug_assertions)]`. Gating those three would let this step run crate-wide.
        run: 'cargo test --release --lib calling:: --all-features'

      - name: Doc build (deny warnings)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --lib --all-features

      - name: cargo audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  macos:
    # **The same source must give the same bytes on macOS as on Linux.** Rust's `f64::ln`, `exp`
    # and the rest call the operating system's maths library, and Apple's and glibc's round
    # differently in the last binary place; on 2026-09-13 that moved a repeat tract by a base on
    # macOS only. Every such call now goes through `crate::float` (the `libm` crate) and clippy
    # refuses the std methods (doc/devel/implementation_plans/portable_float.md). This job is what
    # keeps it true: `cli::cross_platform_digests` pins the checksum of a fitted parameters file and
    # of the calls made with it, and the Linux job above runs the same test against the same
    # recorded checksums.
    #
    # `--examples` is left out here: examples are research tools outside the portability guarantee,
    # and three of their tests (`ng_generic_loci_dump` twice, `ng_ssr_loci_dump` once) fail on `main`
    # on every platform measured — natively on macOS and in the arm64 Linux container (2026-09-14/15,
    # doc/devel/reports/implementations/portable_float_B7_measurements_2026-09-15.md §4). That makes
    # the Linux job's `--examples` step above likely to fail on `main` too; it is not changed here.
    #
    # `macos-15` rather than `macos-latest`, so the arm64 in the job's name is a fact of the image
    # and not of GitHub's current default.
    name: test on macOS (arm64)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test (lib + integration)
        run: cargo test --lib --tests --all-features

  msrv:
    name: MSRV build (rust-version from Cargo.toml)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98
      - uses: Swatinem/rust-cache@v2
      - name: Build at MSRV
        run: cargo build --lib --all-features
