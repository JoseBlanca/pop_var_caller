# Every number this run scored its reads under, and what each one rests on.
#
# A number that could be fitted carries a `warrant`: fitted_here, borrowed,
# supplied or defaulted. **If you edit one, change its warrant to "supplied" and
# delete its `observations`** — otherwise this file says a number you typed was
# measured, and the run that reads it will report it that way.
#
# The slippage numbers, the prior's two concentrations and the length spectra
# carry no warrant — they say where they came from another way, and there is
# nowhere in them to record that you changed one. Note such an edit elsewhere.
#
# An absent key is not a zero. A missing section, a missing row and a missing
# key each mean the thing was not measured; a zero means it was measured and
# found to be zero. The sections below say which is which where it matters.
format_version = 1
ploidy = 2

[fitted_from]
# What these numbers were fitted from. A run whose reference, samples or read
# groups do not match these is refused; one whose census does not match keeps
# the numbers and reports every one of them as supplied rather than fitted.
reference_digest = "0123456789abcdef"
samples = [
    "TS-1",
    "Ailsa ‘Craig’ \"×2\"",
]
read_groups = [
    { read_group = 0, declared_id = "HWI.3", library = "lib3", sample = "TS-1" },
    { read_group = 1, declared_id = "HWI.4", library = "lib4", sample = "TS-1" },
    { read_group = 2, declared_id = "HWI.5", library = "lib5", sample = "Ailsa ‘Craig’ \"×2\"" },
]

[fitted_from.census]
terms = [
    { term = "the loci actually kept", digest = "fedcba9876543210" },
]

[base_quality_calibration]
# What each read's own reported error probability is multiplied by, per read
# group. Above one says the instrument was optimistic and the reads are worse
# than it claimed; one leaves the qualities exactly as reported. It is not a
# multiplier on the Phred score, which moves the other way.
by_read_group = [
    { read_group = 0, error_probability_multiplier = { value = 1.0324, warrant = "fitted_here", observations = { reads = 812344 } } },
    # no calibration: this read group's reported qualities are used exactly as
    # they came, because no usable error rate could be fitted for it
    { read_group = 1, error_probability_multiplier = { value = 1.0, warrant = "defaulted", observations = { reads = 4 } } },
    { read_group = 2, error_probability_multiplier = { value = 0.87, warrant = "supplied", observations = { reads = 640918 } } },
]

[contamination]
# How much of each read group's reads came from somebody else — one row a lane,
# because two lanes of one library can differ: index hopping happens on a
# flowcell, not in a tube. Three states, three different claims:
#   - this whole section absent  -> nobody identified any contamination
#   - a row with no `measurement` -> this lane could not be measured
#   - `fraction = 0.0` with non-zero counts -> measured, and found clean
# To stop correcting one lane, delete its `measurement = { ... }` and leave the
# row; a library sequenced over several lanes has a row for each. Setting a
# fraction to zero says something else: that it was measured and found clean.
by_read_group = [
    { read_group = 0, library = "lib3", measurement = { fraction = 0.031, markers_with_reads = 4211, reads_on_markers = 90233, fitted_from_reads_of = "this_read_groups_own_reads" } },
    { read_group = 1, library = "lib4" },
    { read_group = 2, library = "lib5", measurement = { fraction = 0.0, markers_with_reads = 2903, reads_on_markers = 64118, fitted_from_reads_of = "every_read_of_this_sample" } },
]

[sequencing_batches]
# Who was sequenced beside whom — the population a contaminating read is drawn
# from. `was_declared_by_the_run = false` means nobody said, so everything went
# in one batch. A declared batching that happens to have one batch writes
# identical rows, and this flag is the only thing that tells those two apart.
was_declared_by_the_run = true
by_read_group = [
    { read_group = 0, batch = 0 },
    { read_group = 1, batch = 1 },
    { read_group = 2, batch = 1 },
]
by_sample = [
    { sample = "TS-1", batch = 0 },
    { sample = "Ailsa ‘Craig’ \"×2\"", batch = 1 },
]

[inbreeding]
# How inbred each sample is, as a fraction in [0, 1) — one row a sample, counted
# over the reference positions that sample's reads covered.
by_sample = [
    { sample = "TS-1", inbreeding_coefficient = { value = 0.42, warrant = "fitted_here", observations = { covered_positions = 180600412 } } },
    { sample = "Ailsa ‘Craig’ \"×2\"", inbreeding_coefficient = { value = 0.17, warrant = "borrowed", observations = { covered_positions = 9411027 } } },
]

[ordinary_site_prior]
# What the SNP and indel prior starts from at an ordinary position: how much
# belief the reference allele carries, and how much is shared out across
# whatever alternative alleles a position turns out to have. `rung` says which
# measurement the pair came off — a fitted population curve, the neutral shape
# at a fitted heterozygosity, a cohort with no variation at all, or a stated
# heterozygosity taken from human data, which is the one that rests on nothing
# this run measured.
reference_concentration = 1.0
alternative_concentration_total = 0.0006
rung = "fitted_curve"

[repeat_tracts]
# Everything about repeat tracts. A **stratum** is a class of tract, and every
# row here spells it as `period` — how many bases one repeat unit is — and
# `reference_repeats` — how many copies of it the reference carries.
#
# A pair with no row put no read there; a stratum with no row in
# `length_spectrum_by_stratum` was never fitted on its own tracts and falls to
# its period's pooled one, or to the flat shape below. Neither absence is a
# zero.
#
# Three numbers a stratum: `level` — how often a read reports a tract length
# other than its allele's; `shorter_share` — of the reads that slip, the share
# showing a shorter tract; `fall_off` — how fast two-repeat slips fall off
# against one-repeat slips. `slipped_reads` is fractional because it is how many
# reads the fitted level says slipped, not a count anybody labelled.
#
# Where each of those came from is in `level_origin` and `shares_origin` beside
# it: its stratum's own fit, its period's curve, or a blend of the two, with the
# curve itself recorded so an interpolation can be told from a measurement. A
# `rung` inside one of those curves is not the `rung` in [ordinary_site_prior]:
# here it says what the curve itself was fitted on — this period's own strata,
# the other periods pooled, or a stated constant.
# stated rather than fitted: this many chromosomes' worth of belief, spread flat
# over whatever lengths a tract offers. A run that fitted any stratum states the
# median of its own instead, and says so with a warrant of fitted_here
stated_length_spectrum_concentration = { value = 1.25, warrant = "defaulted" }
slippage_group_by_read_group = [
    { read_group = 0, slippage_group = 0 },
    { read_group = 1, slippage_group = 0 },
    { read_group = 2, slippage_group = 1 },
]
slippage_by_stratum_and_group = [
    { period = 2, reference_repeats = 6, slippage_group = 0, level = 0.0421, shorter_share = 0.83, fall_off = 0.31, level_origin = { smoothing = { blend = { curve_weight = 0.37, curve = { rise_shape = 0.55, intercept = 0.011, slope = 0.004, fitted_from_repeats = 5, fitted_to_repeats = 19, held_out_error = 0.3333333333333333, cells = 23 }, reach = "inside" } }, slipped_reads = 8000.5 }, shares_origin = { slipped_reads = 8000.5, shorter_share_smoothing = "this_stratum", fall_off_smoothing = { this_periods_curve = { curve = { shape = "turning", intercept = 1.4, slope = -0.09, bend = 0.006, centre_repeats = 11.5, fitted_from_repeats = 5, fitted_to_repeats = 19, held_out_error = 0.167, strata = 12, rung = "this_period" }, reach = "above_fitted" } } } },
    { period = 2, reference_repeats = 11, slippage_group = 1, level = 0.0913, shorter_share = 0.79, fall_off = 0.28, level_origin = { smoothing = { this_periods_curve = { curve = { rise_shape = 0.55, intercept = 0.011, slope = 0.004, fitted_from_repeats = 5, fitted_to_repeats = 19, held_out_error = 0.3333333333333333, cells = 23 }, reach = "below_fitted" } } } },
    { period = 1, reference_repeats = 30, slippage_group = 0, level = 0.19, shorter_share = 0.77, fall_off = 0.24, level_origin = { smoothing = "this_stratum", slipped_reads = 12040.25 }, shares_origin = { slipped_reads = 12040.25, shorter_share_smoothing = { blend = { curve_weight = 0.61, curve = { shape = "turning", intercept = 1.4, slope = -0.09, bend = 0.006, centre_repeats = 11.5, fitted_from_repeats = 5, fitted_to_repeats = 19, held_out_error = 0.167, strata = 12, rung = "this_period" }, reach = "inside" } }, fall_off_smoothing = "this_stratum" } },
]
# `shares_by_repeat_offset` runs from -span to +span in whole repeat units from
# the **reference** tract length, so the middle entry is the reference length
# itself, the count is odd, and the shares sum to one. An array read as starting
# at zero shifts every length this stratum expects by one repeat.
length_spectrum_by_stratum = [
    { period = 2, reference_repeats = 6, concentration = 3.5, shares_by_repeat_offset = [0.1, 0.8, 0.1] },
]
length_spectrum_by_period = [
    { period = 2, concentration = 2.75, shares_by_repeat_offset = [0.15, 0.7, 0.15] },
]
# How often a base reads wrong inside a tract — per read group as well as per
# stratum, because that is a property of the chemistry. Counted in bases
# compared, not reads: a read crossing a tract contributes as many bases as it
# crosses.
substitution_rate_by_stratum = [
    { read_group = 0, period = 2, reference_repeats = 6, ploidy = 2, rate = { value = 0.0012, warrant = "borrowed", observations = { bases_compared = 40122 } } },
]

[stated_constants]
# The numbers no fit produces, written out so that what a run inherited is
# visible and editable rather than buried in the binary.
# inherited from the existing caller and never measured here: the share of
# repeat-tract reads that came from nowhere the model can explain
repeat_tract_outlier_weight = { value = 0.01, warrant = "defaulted" }
