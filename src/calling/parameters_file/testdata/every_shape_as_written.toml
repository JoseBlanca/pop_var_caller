# **All 7 groups of numbers in this file were fitted from reads**: the
# base-quality calibration, contamination, the inbreeding coefficients, the
# ordinary-site prior's seed, repeat-tract slippage, repeat-tract allele length
# variations and repeat-tract substitution rates.
#
# **Whose reads is a second question, and only 3 of the 7 groups answer it.**
# The base-quality calibration, the inbreeding coefficients and repeat-tract
# substitution rates carry a `warrant` on every number: `fitted_here` means it
# was estimated from that read group's or that sample's own reads; `borrowed`
# means there was too little of them, so the mean of the sample's other read
# groups was taken; `supplied` means the run was handed the number rather than
# fitting it; `defaulted` means nothing could be fitted and nothing was
# supplied, so a stated constant was used.
#
# The other 4 — contamination, the ordinary-site prior's seed, repeat-tract
# slippage and repeat-tract allele length variations — say how a number was
# arrived at and not whose reads it came from: a smoothing origin, a rung, or
# which reads a contamination fraction was fitted from. **So in a file whose
# numbers were fitted over a different cohort those 4 still read as fitted**,
# and only the 3 above are marked down to `supplied`.
#
# A group counts as fitted where any part of it was; within one, each number's
# own `warrant` or origin says which.
#
# Every number this run scored its reads under, and what each one rests on.
#
# A number that could be fitted carries a `warrant`: fitted_here, borrowed,
# supplied or defaulted. **If you edit one, change its warrant to "supplied" and
# delete its `observations`** — otherwise this file says a number you typed was
# measured, and the run that reads it will report it that way. A `supplied`
# number that still carries `observations` came that way from another run's
# file, and those counts are that run's.
#
# A number the fit measured also carries a `standard_error` where it could
# compute one: how far the number would typically move if the same kind of data
# were drawn again, on the number's own scale. It comes from how sharply the
# fit's likelihood falls away from the number, or for a rate counted directly
# from the spread of the count, and near either end of the number's range it is
# not the spread of a bell curve. **No `standard_error` is not an error of
# zero**: it means nothing determined the number — no reads, a stated default —
# or no error is computed for it. A `supplied` number's `standard_error`, like
# its `observations`, is that of the fit that first produced it. If you edit a
# number, delete its `standard_error` with its `observations`.
#
# **Three keys do not take every warrant.**
# `repeat_tracts.fallback_between_locus_share` and
# `repeat_tracts.fallback_between_locus_share_with_own_shares` are `fitted_here`
# only where a stratum row of this file carries a `between_locus_share` for them
# to be the median of, and `defaulted` only at their built-in 1/11 (0.0909…) and
# 1/2; `stated_constants.repeat_tract_outlier_weight` is `defaulted` only at the
# built-in constant. All three take `supplied` freely, which is what you write
# when you change one. Anything else is refused, and says so.
#
# **What that checking reaches, and what it cannot.** It reaches those three
# keys and nowhere else. It cannot catch a number you changed that still says
# `fitted_here` or `borrowed`: nothing in this file can tell your value from a
# fitted one, so the run will report it as measured, with the old `observations`
# count still beside it. And on every other key a `defaulted` warrant is checked
# against nothing — including the inbreeding coefficient, whose built-in number
# is 0.0. The base-quality multiplier is not one of them: a `defaulted`
# multiplier is **not** fixed at 1.0, and the note beside
# `base_quality_calibration` says what it is instead. A `defaulted` substitution
# rate is the one to avoid writing by hand, and the reason is worth stating
# because a note further down looks like it contradicts this: the caller
# **does** default that number, at the tract and for the cells that need it, but
# it never writes one as a row here — so a `defaulted` warrant on a row of
# `substitution_rate_by_stratum` is a claim no build makes.
#
# The slippage numbers, the prior's two concentrations and the allele length
# variation rows carry no warrant — they say where they came from another way,
# and there is nowhere in them to record that you changed one. Note such an edit
# elsewhere.
#
# An absent key is not a zero. A missing section, a missing row and a missing
# key each mean the thing was not measured. A zero is not automatically the
# opposite: a zero **under a `fitted_here` or `borrowed` warrant** was measured
# and found to be zero, and a zero under any other warrant is a stated number —
# the inbreeding coefficient a run takes when nobody said is 0.0, `defaulted`.
# The sections below say which is which where it matters.
format_version = 5
ploidy = 2

[fitted_from]
# What these numbers were fitted from. A run whose reference, samples or read
# groups do not match these is refused; one whose census does not match keeps
# the numbers and reports every one of them as supplied rather than fitted.
#
# The MD5 of the reference this run ran against: every contig's bases,
# uppercased, run together in the order the FASTA holds them. So soft-masking
# and line width do not change it and contig order does. `[fitted_from.census]`
# below has a `reference digest` line of its own — that is this same reference
# seen from the evidence's side, and the key that turns a run away from the
# wrong reference is this one.
reference_digest = "0123456789abcdef0123456789abcdef"
samples = [
    "TS-1",
    "Ailsa ‘Craig’ \"×2\"",
]
read_groups = [
    { read_group = 0, declared_id = "HWI.3", library = "lib3", sample = "TS-1" },
    { read_group = 1, declared_id = "HWI.4", library = "lib4", sample = "TS-1" },
    { read_group = 2, declared_id = "HWI.5", library = "lib5", sample = "Ailsa ‘Craig’ \"×2\"" },
]
#
# How each start of the SNP/indel fit ended, in the order it ran them. The fit
# starts from several points and keeps the best; `converged` means the step
# still left to the best value the data allow was worth less than a thousandth
# of a log-likelihood unit, which on every cohort measured put every number
# within about a tenth of its standard error of that value; `at_the_pass_limit`
# means it ran out of passes first and is not convergence, and
# `agreed_with_an_earlier_start` means it was heading where an earlier one had
# converged and stopped there. `passes` counts passes over the data.
snp_indel_fit_starts = [
    { start = 1, ended = "converged", passes = 41 },
    { start = 2, ended = "agreed_with_an_earlier_start", passes = 12, agreed_with_start = 1 },
    { start = 3, ended = "at_the_pass_limit", passes = 200 },
]

[fitted_from.census]
# Which store of evidence these numbers were fitted from — one line for each of
# the things two runs' evidence has to agree on before it can be pooled, each
# written as a digest of what that thing was rather than as the thing itself,
# because several of them are whole tables and settings blocks.
#
# A run whose own evidence disagrees on any one of these lines is the demotion
# the section above describes, and it demotes **every** number in the file
# rather than the ones that line touches — the numbers were fitted together out
# of this one store of evidence, so a disagreement about the evidence
# disqualifies all of them. The run says which line differed.
#
# Do not edit these to make a run match. Nothing checks a digest against what it
# claims to digest, so an edit buys a run that reports numbers as fitted from
# its own data when they were fitted from somebody else's — and there is no way
# to work out the right value by hand in any case. The same goes for
# `reference_digest`, `samples` and `read_groups` above, where a mismatch is
# turned away rather than demoted.
terms = [
    { term = "selection seed", digest = "1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a" },
    { term = "reference digest", digest = "2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b" },
    { term = "analysed region set", digest = "3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c" },
    { term = "repeat catalog build settings", digest = "4d4d4d4d4d4d4d4d4d4d4d4d4d4d4d4d" },
    { term = "STR routing criteria", digest = "5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e" },
    { term = "generic target position count", digest = "6f6f6f6f6f6f6f6f6f6f6f6f6f6f6f6f" },
    { term = "STR per-stratum cap", digest = "70707070707070707070707070707070" },
    { term = "the loci actually kept", digest = "81818181818181818181818181818181" },
    { term = "per-stratum locus counts", digest = "92929292929292929292929292929292" },
    { term = "per-locus read cap", digest = "a3a3a3a3a3a3a3a3a3a3a3a3a3a3a3a3" },
    { term = "depth ladder edges", digest = "b4b4b4b4b4b4b4b4b4b4b4b4b4b4b4b4" },
    { term = "per-position depth cap", digest = "c5c5c5c5c5c5c5c5c5c5c5c5c5c5c5c5" },
]

[base_quality_calibration]
# What each read's own reported error probability is multiplied by, per read
# group. Above one says the instrument was optimistic and the reads are worse
# than it claimed; below one says they are better; one leaves the qualities
# exactly as reported. It is not a multiplier on the Phred score, which moves
# the other way.
#
# **A `defaulted` multiplier is not 1.0 in general**, and the rows below say
# `not calibrated` where it applies. A read group no error rate could be fitted
# for is *charged the caller's stated rate of one error in a thousand* rather
# than taken at the quality it reported — so its multiplier is that stated rate
# divided by this library's own mean reported error, and rises above one
# wherever the instrument claimed better than one in a thousand. A library
# averaging Q36 gets 4.0: every base of it is scored four times likelier to be
# wrong than the file it came in said. **The exception is a run that fitted
# nothing at all**, which read nothing to take a mean over and writes 1.0.
by_read_group = [
    { read_group = 0, error_probability_multiplier = { value = 1.0324, standard_error = 0.0071, warrant = "fitted_here", observations = { reads = 812344 } } },
    # not calibrated: no usable error rate could be fitted for this read group,
    # so it is charged the stated rate — see the note above this table
    { read_group = 1, error_probability_multiplier = { value = 1.0, warrant = "defaulted" } },
    { read_group = 2, error_probability_multiplier = { value = 0.87, standard_error = 0.0093, warrant = "supplied", observations = { reads = 640918 } } },
]

[contamination]
# How much of each read group's reads came from somebody else — one row a lane,
# because two lanes of one library can differ: index hopping happens on a
# flowcell, not in a tube. Three states, three different claims:
#   - this whole section absent  -> nobody identified any contamination
#   - a row with no `measurement` -> this lane could not be measured
#   - a zero share with non-zero counts -> measured, and found clean
# To stop correcting one lane, delete its `measurement = { ... }` and leave the
# row; a library sequenced over several lanes has a row for each. Setting that
# share to zero says something else: that it was measured and found clean.
by_read_group = [
    { read_group = 0, library = "lib3", measurement = { share_of_reads_from_another_sample = 0.031, markers_with_reads = 4211, reads_on_markers = 90233, fitted_from_reads_of = "this_read_groups_own_reads" } },
    { read_group = 1, library = "lib4" },
    { read_group = 2, library = "lib5", measurement = { share_of_reads_from_another_sample = 0.0, markers_with_reads = 2903, reads_on_markers = 64118, fitted_from_reads_of = "every_read_of_this_sample" } },
]

[sequencing_batches]
# Who was sequenced beside whom — the population a contaminating read is drawn
# from. `batching_was_declared = false` means nobody said, so everything went in
# one batch. A declared batching that happens to have one batch writes identical
# rows, and this flag is the only thing that tells those two apart.
#
# **A sample's read groups all go in one batch**, and it is the batch its own
# row names — the two tables below say the same thing about a sample twice, and
# a file in which they disagree is refused. The grain is a lane everywhere else
# in this file precisely because two lanes of one plant can differ; here they
# cannot, because a contaminating read is drawn against one set of neighbours
# and a sample has one genotype to draw.
batching_was_declared = true
by_read_group = [
    { read_group = 0, batch = 0 },
    { read_group = 1, batch = 0 },
    { read_group = 2, batch = 1 },
]
by_sample = [
    { sample = "TS-1", batch = 0 },
    { sample = "Ailsa ‘Craig’ \"×2\"", batch = 1 },
]

[inbreeding]
# How inbred each sample is, as a fraction in [0, 1) — one row a sample, counted
# over the reference positions that sample's reads covered.
by_sample = [
    { sample = "TS-1", inbreeding_coefficient = { value = 0.42, standard_error = 0.012, warrant = "fitted_here", observations = { covered_positions = 180600412 } } },
    { sample = "Ailsa ‘Craig’ \"×2\"", inbreeding_coefficient = { value = 0.17, warrant = "borrowed", observations = { covered_positions = 9411027 } } },
]

[ordinary_site_prior]
# What the SNP and indel prior starts from at an ordinary position: how much
# belief the reference allele carries, and how much is shared out across
# whatever alternative alleles a position turns out to have. `rung` says which
# measurement the pair came off: a fitted population curve (`fitted_curve`), the
# neutral shape at a fitted heterozygosity (`neutral_shape`), a cohort with no
# variation at all (`zero_diversity`), or a stated heterozygosity taken from
# human data (`stated_heterozygosity`), which is the one that rests on nothing
# this run measured.
reference_concentration = 1.0
alternative_concentration_total = 0.0006
rung = "fitted_curve"

[ordinary_site_prior.fitted_density]
# What the seed above was read off. Informational: a calling run reads none of
# it, and editing it changes nothing.
#
# The population's allele-frequency density in four numbers: the share of
# positions where the population carries only the reference base
# (`invariant_share`), the share where it carries only a non-reference base
# (`fixed_non_reference_share`), and the two shapes of the Beta the
# non-reference allele's frequency follows at the positions that segregate.
# `expected_heterozygosity` and `expected_alternative_frequency` are the two
# integrals of it the seed above was built from.
#
# **A position segregating at one in a million looks invariant in any cohort
# that can be sequenced**, so the reads fix how many positions segregate at a
# frequency they can see — `share_segregating_above_stated_frequency`, the share
# above `stated_frequency` — and not how many segregate at all.
# `invariant_share` and `segregating_shape_a` trade against each other along
# what the reads cannot see: more invariant positions against more of the Beta's
# weight near zero. Where the data do not tell the two apart, both say
# `separately_determined = false` and carry no `standard_error`, and the number
# to quote is `share_segregating_above_stated_frequency`.
stated_frequency = 0.01
invariant_share = { value = 0.8416, separately_determined = false }
fixed_non_reference_share = { value = 2.96e-5, standard_error = 4.05e-6 }
segregating_shape_a = { value = 0.02, separately_determined = false }
segregating_shape_b = { value = 4.28, standard_error = 0.0605 }
share_segregating_above_stated_frequency = { value = 0.008447, standard_error = 0.000204 }
expected_heterozygosity = { value = 0.0011895, standard_error = 3.03e-5 }
expected_alternative_frequency = { value = 0.0007661, standard_error = 2.02e-5 }

[duplicated_positions]
# The duplicated class's numbers: positions where some sample carries more
# copies of a stretch than the reference does. Informational: a calling run
# reads none of it, and editing it changes nothing.
#
# `duplicated_share` is the share of positions some sample carries an extra copy
# of; the carrier Beta's two shapes describe what share of the panel carries a
# given duplication. **A duplication carried by one plant in a thousand has no
# carrier among a few samples**, so the reads fix the share of positions
# duplicated in more than `stated_frequency` of the panel —
# `share_with_carriers_above_stated_frequency` — and not how many are duplicated
# at all. `duplicated_share` and `carrier_shape_a` trade against each other
# along what the reads cannot see. Where the data do not tell the two apart,
# both say `separately_determined = false` and carry no `standard_error`, and
# the number to quote is `share_with_carriers_above_stated_frequency`.
stated_frequency = 0.01
duplicated_share = { value = 0.026, standard_error = 0.0023, separately_determined = true }
carrier_shape_a = { value = 2.22, standard_error = 0.439, separately_determined = true }
carrier_shape_b = { value = 3.51, standard_error = 0.522 }
share_with_carriers_above_stated_frequency = { value = 0.026 }

[repeat_tracts]
# Everything about repeat tracts. A **stratum** is a class of tract, and every
# row keyed by one spells it as `period` — how many bases one repeat unit is —
# and `reference_repeats` — how many copies of it the reference carries. A
# **slippage group** is a set of read groups whose reads are taken to slip
# alike; the run declares it, and `slippage_group_by_read_group` below is that
# declaration.
#
# `slippage_by_stratum_and_group` is keyed by a stratum **and** a slippage
# group, and a triple with no row means that group put no read in that stratum —
# so one stratum can have a row for one group and none for another. A stratum
# with no row in `allele_length_variation_by_stratum` was never fitted on its
# own tracts and falls to its period's pooled one, or to the flat shape below; a
# stratum whose row has no `between_locus_share` keeps its own shares, held at
# the fallback below. Neither absence is a zero.
#
# Three numbers a stratum: `share_of_reads_that_slip` — how often a read reports
# a tract length other than its allele's; `shorter_share` — of the reads that
# slip, the share showing a shorter tract; `fall_off` — how fast two-repeat
# slips fall off against one-repeat slips. `expected_slipped_reads` is
# fractional because it is how many reads the fitted share says slipped, not a
# count anybody labelled. They are reads among the samples the stratum was
# fitted on: every sample, unless the row carries `samples_fitted_on` — then a
# large cohort's stratum was fitted on that many of its samples, taken in a
# fixed order that does not look at the data, and every count and error in the
# row is that subset's. A `samples_fitted_on` equal to the cohort's sample count
# means the subset grew to every sample.
#
# Where a number was fitted with this stratum's own reads — its smoothing is
# `penalised_curve`, or `this_stratum` — its origin carries an own-fit standard
# error: `own_fit_standard_error` for the first number,
# `shorter_share_own_fit_standard_error` and `fall_off_own_fit_standard_error`
# for the other two. It is how far that number would typically move if the
# stratum's tracts were drawn again. A number taken from a parametric curve, or
# blended with one, has none: the blend's own error is not computed. A number
# fitted on too few of the stratum's loci with reads, a count this file does not
# carry, has none: the first number below 8 loci, the other two below 3. **Where
# the row's `samples_fitted_on` is fewer than the cohort's samples, the error
# describes the subset's own fit, not how far that fit sits from one on every
# sample**: on a cohort of 2,169 samples, 7 of 12 numbers compared sat further
# from the fit on every sample than the two fits' errors allow for — more than
# two standard deviations of their difference — where about one would by chance.
#
# `share_of_reads_that_slip_origin` says where the first of the three came from
# and `shorter_share_and_fall_off_origin` where the other two did: a point on
# its period's penalised curve (`penalised_curve`), one value per repeat count,
# fitted with the reads of every stratum of that period at once and held close
# to its neighbours' values, the more so the larger its `strength`. `eased_here
# = true` says the reads insisted on a bend at this repeat count, so the curve
# was let bend there. In a file written by the fit before 2026-10-16, a number
# may instead be this stratum's own fit (`this_stratum`), its period's
# parametric curve (`this_periods_curve`), or a blend of the two (`blend`), with
# the curve itself written down so an interpolation can be told from a
# measurement. A row whose two shares were not fitted here at all has no
# `shorter_share_and_fall_off_origin` key. Each origin carries its own
# `expected_slipped_reads` where this stratum fitted a slip share of its own,
# and in that older fit's rows neither carries one where the number was taken
# whole from a parametric curve — so a row showing the same count twice is not a
# duplicate, and a row showing none fitted nothing of its own. A stratum on a
# penalised curve was fitted with one extra read's worth of evidence added to
# its own, evidence that behaves as calling's default stutter does
# (`share_of_reads_that_slip` 0.1, `shorter_share` 0.5, `fall_off` 0.05). So a
# row with `expected_slipped_reads` below one carries no error on any of its
# three numbers: too few of its reads slipped to say how far off they may be.
# Its `shorter_share` and `fall_off` lean on that default, and on its neighbours
# on the curve where it has any, as much as on its own reads.
#
# The curves under `shorter_share_and_fall_off_origin` also record
# `curve_fitted_on`, which says what that curve itself was fitted on: this
# period's own strata (`this_period`), or those same strata where there were too
# few to score the shape (`this_period_unscored`), or the other periods pooled
# (`other_periods`), or a stated constant where no period had anything to fit
# (`built_in_default`). The curve under `share_of_reads_that_slip_origin` is a
# different fit and has no such key.
#
# `fallback_between_locus_share` is the between-locus share a tract is held at
# where its stratum has none of its own. A between-locus share says how much of
# a stratum's variation in allele length lies between its loci rather than
# within one: near 0, every locus carries the stratum's whole spread of lengths;
# near 1, each locus is fixed at one length. A tract whose stratum and period
# have no row gets a flat shape over whatever lengths it offers, held at this
# one; a stratum row with shares and no `between_locus_share` keeps its shares,
# held at `fallback_between_locus_share_with_own_shares`. The two differ only
# where no stratum has a between-locus share, and then they are two stated
# constants for two different shapes: ten chromosomes keep a flat shape from
# leaning homozygous, and about one makes a stratum's real shares match how
# often a genome's two copies agree. A smaller share makes the prior harder for
# the reads to move. A run in which any stratum has a between-locus share states
# the median of those shares and marks it `fitted_here`. The median counts only
# the strata whose fit had at least 8 loci with reads, the same count below
# which a stratum carries no own-fit standard error on its between-locus share
# or its `share_of_reads_that_slip`; where no stratum with a share has that
# many, it counts every stratum with a share. This file does not carry the
# counts, so the median cannot be recomputed from the rows below. A run in which
# no stratum has a between-locus share states the built-in 1/11 (0.0909…) here
# and 1/2 for `fallback_between_locus_share_with_own_shares`, and marks both
# `defaulted`. A run handed this file writes back the warrant it found there,
# because a file's warrants survive being read — demoting them on every read
# would have the same cohort report different warrants depending on which way it
# was called. Mark it `supplied` yourself if you change the number. It carries
# no `observations` in any of those cases — a median over strata is not a
# measurement with a sample size.
fallback_between_locus_share = { value = 0.22222222222222224, warrant = "fitted_here" }
fallback_between_locus_share_with_own_shares = { value = 0.22222222222222224, warrant = "fitted_here" }
slippage_group_by_read_group = [
    { read_group = 0, slippage_group = 0 },
    { read_group = 1, slippage_group = 0 },
    { read_group = 2, slippage_group = 1 },
]
slippage_by_stratum_and_group = [
    { period = 1, reference_repeats = 30, slippage_group = 0, share_of_reads_that_slip = 0.19, shorter_share = 0.77, fall_off = 0.24, share_of_reads_that_slip_origin = { smoothing = "this_stratum", expected_slipped_reads = 12040.25, own_fit_standard_error = 0.0021 }, shorter_share_and_fall_off_origin = { expected_slipped_reads = 12040.25, shorter_share_smoothing = { blend = { curve_weight = 0.61, curve = { shape = "turning", intercept = 1.4, slope = -0.09, bend = 0.006, centre_repeats = 22.5, fitted_from_repeats = 5, fitted_to_repeats = 40, held_out_error = 0.167, strata = 36, curve_fitted_on = "this_period" }, reach = "inside_the_fitted_range" } }, fall_off_smoothing = "this_stratum", fall_off_own_fit_standard_error = 0.018 }, samples_fitted_on = 1 },
    { period = 2, reference_repeats = 6, slippage_group = 0, share_of_reads_that_slip = 0.0421, shorter_share = 0.83, fall_off = 0.31, share_of_reads_that_slip_origin = { smoothing = { blend = { curve_weight = 0.37, curve = { rise_shape = 0.55, intercept = 0.011, slope = 0.004, fitted_from_repeats = 5, fitted_to_repeats = 19, held_out_error = 0.3333333333333333, cells = 15 }, reach = "inside_the_fitted_range" } }, expected_slipped_reads = 8000.5 }, shorter_share_and_fall_off_origin = { expected_slipped_reads = 8000.5, shorter_share_smoothing = "this_stratum", fall_off_smoothing = { this_periods_curve = { curve = { shape = "turning", intercept = 1.4, slope = -0.09, bend = 0.006, centre_repeats = 3.0, fitted_from_repeats = 2, fitted_to_repeats = 4, held_out_error = 0.167, strata = 3, curve_fitted_on = "this_period" }, reach = "above_the_fitted_range" } }, shorter_share_own_fit_standard_error = 0.011 } },
