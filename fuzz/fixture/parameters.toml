# How often a base reads wrong inside a tract — per read group as well as per
# stratum, because that is a property of the chemistry, and per `ploidy` as
# well, because that is the set of genotypes the fit scored these tracts
# against. That third key is why a row repeats the number at the top of the
# file: a cohort called at two ploidies carries a row for each. Counted in bases
# compared, not reads: a read crossing a tract contributes as many bases as it
# crosses.
substitution_rate_by_stratum = [
    { read_group = 0, period = 1, reference_repeats = 8, ploidy = 2, rate = { value = 0.0034482758620689655, standard_error = 0.004885057471264368, warrant = "fitted_here", observations = { bases_compared = 144 } } },
    { read_group = 0, period = 1, reference_repeats = 14, ploidy = 2, rate = { value = 0.007042253521126761, standard_error = 0.009994755901021966, warrant = "fitted_here", observations = { bases_compared = 70 } } },
    { read_group = 1, period = 1, reference_repeats = 8, ploidy = 2, rate = { value = 0.0034482758620689655, standard_error = 0.004885057471264368, warrant = "fitted_here", observations = { bases_compared = 144 } } },
    { read_group = 1, period = 1, reference_repeats = 14, ploidy = 2, rate = { value = 0.007042253521126761, standard_error = 0.009994755901021966, warrant = "fitted_here", observations = { bases_compared = 70 } } },
