[repeat_tracts]
# Everything about repeat tracts. A **stratum** is a class of tract, and every
# row keyed by one spells it as `period` — how many bases one repeat unit is —
# and `reference_repeats` — how many copies of it the reference carries. A
# **slippage group** is a set of read groups whose reads are taken to slip
# alike; the run declares it, and `slippage_group_by_read_group` below is that
# declaration.
#
# `slippage_by_stratum_and_group` is keyed by a stratum **and** a slippage
# group, and a triple with no row means that group put no read in that stratum —
# so one stratum can have a row for one group and none for another. A stratum
# with no row in `allele_length_variation_by_stratum` was never fitted on its
# own tracts and falls to its period's pooled one, or to the flat shape below; a
# stratum whose row has no `between_locus_share` keeps its own shares, held at
# the fallback below. Neither absence is a zero.
#
# Three numbers a stratum: `share_of_reads_that_slip` — how often a read reports
# a tract length other than its allele's; `shorter_share` — of the reads that
# slip, the share showing a shorter tract; `fall_off` — how fast two-repeat
# slips fall off against one-repeat slips. `expected_slipped_reads` is
# fractional because it is how many reads the fitted share says slipped, not a
# count anybody labelled.
#
# Where a number was fitted with this stratum's own reads — its smoothing is
# `penalised_curve` — its origin carries an own-fit standard error:
# `own_fit_standard_error` for the first number,
# `shorter_share_own_fit_standard_error` and `fall_off_own_fit_standard_error`
# for the other two. It is how far that number would typically move if the
# stratum's tracts were drawn again. A number fitted on too few of the stratum's
# loci with reads, a count this file does not carry, has none: the first number
# below 8 loci, the other two below 3.
#
# `share_of_reads_that_slip_origin` says where the first of the three came from
# and `shorter_share_and_fall_off_origin` where the other two did: a point on
# its period's penalised curve (`penalised_curve`), one value per repeat count,
# fitted with the reads of every stratum of that period at once and held close
# to its neighbours' values, the more so the larger its `strength`. `eased_here
# = true` says the reads insisted on a bend at this repeat count, so the curve
# was let bend there. A row whose two shares were not fitted here at all has no
# `shorter_share_and_fall_off_origin` key. Each origin carries its own
# `expected_slipped_reads` — so a row showing the same count twice is not a
# duplicate. A stratum on a penalised curve was fitted with one extra read's
# worth of evidence added to its own, evidence that behaves as calling's default
# stutter does (`share_of_reads_that_slip` 0.1, `shorter_share` 0.5, `fall_off`
# 0.05). So a row with `expected_slipped_reads` below one carries no error on
# any of its three numbers: too few of its reads slipped to say how far off they
# may be. Its `shorter_share` and `fall_off` lean on that default, and on its
# neighbours on the curve where it has any, as much as on its own reads.
#
# `fallback_between_locus_share` is the between-locus share a tract is held at
# where its stratum has none of its own. A between-locus share says how much of
# a stratum's variation in allele length lies between its loci rather than
# within one: near 0, every locus carries the stratum's whole spread of lengths;
# near 1, each locus is fixed at one length. A tract whose stratum and period
# have no row gets a flat shape over whatever lengths it offers, held at this
# one; a stratum row with shares and no `between_locus_share` keeps its shares,
# held at `fallback_between_locus_share_with_own_shares`. The two differ only
# where no stratum has a between-locus share, and then they are two stated
# constants for two different shapes: ten chromosomes keep a flat shape from
# leaning homozygous, and about one makes a stratum's real shares match how
# often a genome's two copies agree. A smaller share makes the prior harder for
# the reads to move. A run in which any stratum has a between-locus share states
# the median of those shares and marks it `fitted_here`. The median counts only
# the strata whose fit had at least 8 loci with reads, the same count below
# which a stratum carries no own-fit standard error on its between-locus share
# or its `share_of_reads_that_slip`; where no stratum with a share has that
# many, it counts every stratum with a share. This file does not carry the
# counts, so the median cannot be recomputed from the rows below. A run in which
# no stratum has a between-locus share states the built-in 1/11 (0.0909…) here
# and 1/2 for `fallback_between_locus_share_with_own_shares`, and marks both
# `defaulted`. A run handed this file writes back the warrant it found there,
# because a file's warrants survive being read — demoting them on every read
# would have the same cohort report different warrants depending on which way it
# was called. Mark it `supplied` yourself if you change the number. It carries
# no `observations` in any of those cases — a median over strata is not a
# measurement with a sample size.
# no stratum of this run has a between-locus share of its own, so there was no
# median to take and this is the caller's own constant
fallback_between_locus_share = { value = 0.09090909090909091, warrant = "defaulted" }
# no stratum of this run has a between-locus share of its own, so there was no
