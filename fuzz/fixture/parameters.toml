# **6 of the 7 groups of numbers in this file were fitted from reads**, and 1
# were not: contamination. What a group that was not fitted holds instead is
# said in its own section below.
#
# **Whose reads is a second question, and only 3 of the 7 groups answer it.**
# The base-quality calibration, the inbreeding coefficients and repeat-tract
# substitution rates carry a `warrant` on every number: `fitted_here` means it
# was estimated from that read group's or that sample's own reads; `borrowed`
# means there was too little of them, so the mean of the sample's other read
# groups was taken; `supplied` means the run was handed the number rather than
# fitting it; `defaulted` means nothing could be fitted and nothing was
# supplied, so a stated constant was used.
#
# The other 4 — contamination, the ordinary-site prior's seed, repeat-tract
# slippage and repeat-tract allele length variations — say how a number was
# arrived at and not whose reads it came from: a smoothing origin, a rung, or
# which reads a contamination fraction was fitted from. **So in a file whose
# numbers were fitted over a different cohort those 4 still read as fitted**,
# and only the 3 above are marked down to `supplied`.
#
# A group counts as fitted where any part of it was; within one, each number's
# own `warrant` or origin says which.
#
# Every number this run scored its reads under, and what each one rests on.
#
# A number that could be fitted carries a `warrant`: fitted_here, borrowed,
# supplied or defaulted. **If you edit one, change its warrant to "supplied" and
# delete its `observations`** — otherwise this file says a number you typed was
# measured, and the run that reads it will report it that way. A `supplied`
# number that still carries `observations` came that way from another run's
# file, and those counts are that run's.
#
# A number the fit measured also carries a `standard_error` where it could
# compute one: how far the number would typically move if the same kind of data
# were drawn again, on the number's own scale. It comes from how sharply the
# fit's likelihood falls away from the number, or for a rate counted directly
# from the spread of the count, and near either end of the number's range it is
# not the spread of a bell curve. **No `standard_error` is not an error of
# zero**: it means nothing determined the number — no reads, a stated default —
# or no error is computed for it. A `supplied` number's `standard_error`, like
# its `observations`, is that of the fit that first produced it. If you edit a
# number, delete its `standard_error` with its `observations`.
#
# **Three keys do not take every warrant.**
# `repeat_tracts.fallback_between_locus_share` and
# `repeat_tracts.fallback_between_locus_share_with_own_shares` are `fitted_here`
# only where a stratum row of this file carries a `between_locus_share` for them
# to be the median of, and `defaulted` only at their built-in 1/11 (0.0909…) and
# 1/2; `stated_constants.repeat_tract_outlier_weight` is `defaulted` only at the
# built-in constant. All three take `supplied` freely, which is what you write
# when you change one. Anything else is refused, and says so.
#
# **What that checking reaches, and what it cannot.** It reaches those three
# keys and nowhere else. It cannot catch a number you changed that still says
# `fitted_here` or `borrowed`: nothing in this file can tell your value from a
# fitted one, so the run will report it as measured, with the old `observations`
# count still beside it. And on every other key a `defaulted` warrant is checked
# against nothing — including the inbreeding coefficient, whose built-in number
# is 0.0. The base-quality multiplier is not one of them: a `defaulted`
# multiplier is **not** fixed at its built-in 2.0, and the note beside
# `base_quality_calibration` says what it is instead. A `defaulted` substitution
# rate is the one to avoid writing by hand, and the reason is worth stating
# because a note further down looks like it contradicts this: the caller
# **does** default that number, at the tract and for the cells that need it, but
# it never writes one as a row here — so a `defaulted` warrant on a row of
# `substitution_rate_by_stratum` is a claim no build makes.
#
# The slippage numbers, the prior's two concentrations and the allele length
# variation rows carry no warrant — they say where they came from another way,
# and there is nowhere in them to record that you changed one. Note such an edit
# elsewhere.
#
# An absent key is not a zero. A missing section, a missing row and a missing
# key each mean the thing was not measured. A zero is not automatically the
# opposite: a zero **under a `fitted_here` or `borrowed` warrant** was measured
# and found to be zero, and a zero under any other warrant is a stated number —
# the inbreeding coefficient a run takes when nobody said is 0.0, `defaulted`.
# The sections below say which is which where it matters.
format_version = 6
ploidy = 2

[fitted_from]
# What these numbers were fitted from. A run whose reference, samples or read
# groups do not match these is refused; one whose census does not match keeps
# the numbers and reports every one of them as supplied rather than fitted.
#
# The MD5 of the reference this run ran against: every contig's bases,
# uppercased, run together in the order the FASTA holds them. So soft-masking
# and line width do not change it and contig order does. `[fitted_from.census]`
# below has a `reference digest` line of its own — that is this same reference
# seen from the evidence's side, and the key that turns a run away from the
# wrong reference is this one.
reference_digest = "3360d9bbcd19be7fd4bae410e39a67d3"
samples = [
    "HG002",
    "HG003",
]
read_groups = [
    { read_group = 0, declared_id = "HG002", library = "HG002", sample = "HG002" },
    { read_group = 1, declared_id = "HG003", library = "HG003", sample = "HG003" },
]
#
# How each start of the SNP/indel fit ended, in the order it ran them. The fit
# starts from several points and keeps the best; `converged` means the step
# still left to the best value the data allow was worth less than a thousandth
# of a log-likelihood unit, which on every cohort measured put every number
# within about a tenth of its standard error of that value; `at_the_pass_limit`
# means it ran out of passes first and is not convergence, and
# `agreed_with_an_earlier_start` means it was heading where an earlier one had
# converged and stopped there. `passes` counts passes over the data.
snp_indel_fit_starts = [
    { start = 1, ended = "converged", passes = 42 },
    { start = 2, ended = "agreed_with_an_earlier_start", passes = 36, agreed_with_start = 1 },
    { start = 3, ended = "agreed_with_an_earlier_start", passes = 36, agreed_with_start = 1 },
]

[fitted_from.census]
# Which store of evidence these numbers were fitted from — one line for each of
# the things two runs' evidence has to agree on before it can be pooled, each
# written as a digest of what that thing was rather than as the thing itself,
# because several of them are whole tables and settings blocks.
#
# A run whose own evidence disagrees on any one of these lines is the demotion
# the section above describes, and it demotes **every** number in the file
# rather than the ones that line touches — the numbers were fitted together out
# of this one store of evidence, so a disagreement about the evidence
# disqualifies all of them. The run says which line differed.
#
# Do not edit these to make a run match. Nothing checks a digest against what it
# claims to digest, so an edit buys a run that reports numbers as fitted from
# its own data when they were fitted from somebody else's — and there is no way
# to work out the right value by hand in any case. The same goes for
# `reference_digest`, `samples` and `read_groups` above, where a mismatch is
# turned away rather than demoted.
terms = [
    { term = "selection seed", digest = "dfd0db65a67941e182c79ab15727e5a2" },
    { term = "reference digest", digest = "1add2779471aa9914e5ae0293a97198b" },
    { term = "analysed region set", digest = "e39e17b4b1472e8e46ab3f6dbe8c256a" },
    { term = "repeat catalog build settings", digest = "6e165c1386724a17fed666c07023982e" },
    { term = "STR routing criteria", digest = "3c5bfe850eb965753ffd00fe47fc0571" },
    { term = "generic target position count", digest = "050e3cd3e4a9a783789cda7ad46c77ef" },
    { term = "STR per-stratum cap", digest = "7b7837a8f93a9cd849fdc8cec89de0e1" },
    { term = "the loci actually kept", digest = "5efabcb5f61a10c6bb7fa9cf5ba6c3ac" },
    { term = "per-stratum locus counts", digest = "17cffbf184fae7d2ef6a9ce97f328273" },
    { term = "per-locus read cap", digest = "0c4e8b1d8c1e1efc2bca701acd03e7b0" },
    { term = "depth ladder edges", digest = "2d2d67eb0ff11ce231662d14500da1df" },
    { term = "per-position depth cap", digest = "297ce8a0dad251cb6b2a5f291c870fc0" },
]

[base_quality_calibration]
# What each read's own reported error probability is multiplied by, per read
# group. Above one says the instrument was optimistic and the reads are worse
# than it claimed; below one says they are better; one leaves the qualities
# exactly as reported. It is not a multiplier on the Phred score, which moves
# the other way.
#
# **A `defaulted` multiplier is not one fixed number**, and the rows below say
# `not calibrated` where it applies. A read group no error rate could be fitted
# for is *charged the caller's stated rate of one error in a thousand* rather
# than taken at the quality it reported — so its multiplier is that stated rate
# divided by this library's own mean reported error, and rises above one
# wherever the instrument claimed better than one in a thousand. A library
# averaging Q36 gets 4.0: every base of it is scored four times likelier to be
# wrong than the file it came in said. **The exception is a run that fitted
# nothing at all**, which read nothing to take a mean over and writes the
# caller's default of 2.0: every read twice as likely to be wrong as the file it
# came in said.
by_read_group = [
    { read_group = 0, error_probability_multiplier = { value = 0.0029581681697250038, standard_error = 43.188351733076274, warrant = "fitted_here" } },
    { read_group = 1, error_probability_multiplier = { value = 0.8421419021013137, standard_error = 43.476872544805246, warrant = "fitted_here" } },
]

# **Contamination: no `[contamination]` section, which means nobody identified
# any.** That is not the same as *measured and found clean* — nothing was
# measured. Your reads are scored as though none of them came from another
# individual, which is the read likelihood's plain formula rather than a
# correction of size zero. A run that fitted contamination writes a section here
# with one row a lane.

[sequencing_batches]
# Who was sequenced beside whom — the population a contaminating read is drawn
# from. `batching_was_declared = false` means nobody said, so everything went in
# one batch. A declared batching that happens to have one batch writes identical
# rows, and this flag is the only thing that tells those two apart.
#
# **A sample's read groups all go in one batch**, and it is the batch its own
# row names — the two tables below say the same thing about a sample twice, and
# a file in which they disagree is refused. The grain is a lane everywhere else
# in this file precisely because two lanes of one plant can differ; here they
# cannot, because a contaminating read is drawn against one set of neighbours
# and a sample has one genotype to draw.
batching_was_declared = false
by_read_group = [
    { read_group = 0, batch = 0 },
    { read_group = 1, batch = 0 },
]
by_sample = [
    { sample = "HG002", batch = 0 },
    { sample = "HG003", batch = 0 },
]

[inbreeding]
# How inbred each sample is, as a fraction in [0, 1) — one row a sample, counted
# over the reference positions that sample's reads covered.
by_sample = [
    { sample = "HG002", inbreeding_coefficient = { value = 5e-10, warrant = "fitted_here", observations = { covered_positions = 17434 } } },
    { sample = "HG003", inbreeding_coefficient = { value = 0.7378603064305819, warrant = "fitted_here", observations = { covered_positions = 17495 } } },
]

[ordinary_site_prior]
# What the SNP and indel prior starts from at an ordinary position: how much
# belief the reference allele carries, and how much is shared out across
# whatever alternative alleles a position turns out to have. `rung` says which
# measurement the pair came off: a fitted population curve (`fitted_curve`), the
# neutral shape at a fitted heterozygosity (`neutral_shape`), a cohort with no
# variation at all (`zero_diversity`), or a stated heterozygosity taken from
# human data (`stated_heterozygosity`), which is the one that rests on nothing
# this run measured.
reference_concentration = 0.49661105897485336
alternative_concentration_total = 0.00035082678915487946
rung = "fitted_curve"

[ordinary_site_prior.fitted_density]
# What the seed above was read off. Informational: a calling run reads none of
# it, and editing it changes nothing.
#
# The population's allele-frequency density in four numbers: the share of
# positions where the population carries only the reference base
# (`invariant_share`), the share where it carries only a non-reference base
# (`fixed_non_reference_share`), and the two shapes of the Beta the
# non-reference allele's frequency follows at the positions that segregate.
# `expected_heterozygosity` and `expected_alternative_frequency` are the two
# integrals of it the seed above was built from.
#
# **A position segregating at one in a million looks invariant in any cohort
# that can be sequenced**, so the reads fix how many positions segregate at a
# frequency they can see — `share_segregating_above_stated_frequency`, the share
# above `stated_frequency` — and not how many segregate at all.
# `invariant_share` and `segregating_shape_a` trade against each other along
# what the reads cannot see: more invariant positions against more of the Beta's
# weight near zero. Where the data do not tell the two apart, both say
# `separately_determined = false` and carry no `standard_error`, and the number
# to quote is `share_segregating_above_stated_frequency`.
stated_frequency = 0.01
invariant_share = { value = 0.9989365916506548, separately_determined = false }
fixed_non_reference_share = { value = 1e-12, standard_error = 0.008006852450476888 }
segregating_shape_a = { value = 50.0, separately_determined = false }
segregating_shape_b = { value = 25.318281729919054 }
