    { period = 1, reference_repeats = 15, slippage_group = 0, share_of_reads_that_slip = 0.01623570981147006, shorter_share = 0.49727475894538115, fall_off = 0.05412525126282357, share_of_reads_that_slip_origin = { smoothing = { penalised_curve = { strength = 8568778656.673349, eased_here = false, reach = "inside_the_fitted_range" } }, expected_slipped_reads = 0.007395829375342888 }, shorter_share_and_fall_off_origin = { expected_slipped_reads = 0.007395829375342888, shorter_share_smoothing = { penalised_curve = { strength = 8834735834.139048, eased_here = false, reach = "inside_the_fitted_range" } }, fall_off_smoothing = { penalised_curve = { strength = 10000000000.00004, eased_here = false, reach = "inside_the_fitted_range" } } } },
]
