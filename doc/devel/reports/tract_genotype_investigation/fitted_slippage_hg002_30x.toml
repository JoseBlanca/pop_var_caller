# HG002's own slippage, measured on its 30x reads over ng's 20,204-tract ground, as the
# rows a parameters file states slippage in. Paste over the run's own
# `.parameters.toml`: delete its `slippage_by_stratum_and_group = []` line and append
# this file **at the end** — an array-of-tables closes the table it sits in, so pasting
# these where the empty array was would make every key after them a key of the last row.
#
# Against the shipped constants (0.10 / 0.50 / 0.05, one pair for every stratum):
#   * `share_of_reads_that_slip` is not one number. Over homopolymers it runs from
#     4 reads in 1,000 at 8 repeats to 88 in 1,000 at 30 — the shipped 0.10 is about
#     25 times too high at the short end and roughly right only at the very longest
#     tracts. Over period 2 and above it never reaches 0.07.
#   * `shorter_share` is 0.64 for homopolymers and 0.73 for period 2, not 0.50: a read
#     loses repeats about 1.8 to 2.7 times as often as it gains them.
#   * `fall_off` is 0.16 for homopolymers and 0.18 for period 2, not 0.05: about
#     1 slip in 6 moves by more than one repeat, where the shipped number says 1 in 20.
#
# **The origin fields say `this_stratum` throughout because the row shape asked for
# fixes them there, not because every row is its own fit.** A level comes from the bin
# of at least 900 reads its repeat count falls in, made non-decreasing along the count
# and held flat past the shortest and longest bin with reads behind it; `shorter_share`
# and `fall_off` are one pair per period pool (1, 2, and 3-6 together).
# `expected_slipped_reads` carries the real evidence behind each.
#
# Measured on ONE sample, ONE library, ONE aligner, at 30x, over GRCh38 tandem repeats
# inside GIAB's confident intervals. Nothing here is a property of the caller.

[[repeat_tracts.slippage_by_stratum_and_group]]
period = 1
reference_repeats = 1
slippage_group = 0
share_of_reads_that_slip = 0.003897
shorter_share = 0.636292
fall_off = 0.160856
share_of_reads_that_slip_origin = { smoothing = "this_stratum", expected_slipped_reads = 261.9 }
shorter_share_and_fall_off_origin = { expected_slipped_reads = 5048.0, shorter_share_smoothing = "this_stratum", fall_off_smoothing = "this_stratum" }

