<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="432" viewBox="0 0 900 432" version="1.1"
     font-family="'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="13" fill="#0b0b0b">
  <title>Direct mode and psp mode: what each runs, and what adding a sample costs</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444444"/>
    </marker>
  </defs>

  <!-- white page, so the figure reads the same on a dark page -->
  <rect x="0" y="0" width="900" height="432" fill="#ffffff"/>

  <!-- ===== Direct mode ===== -->
  <rect x="10" y="10" width="880" height="174" rx="8" fill="#fafafa" stroke="#9a9a9a" stroke-width="1.2"/>
  <text x="26" y="36" font-size="15" font-weight="bold">Direct mode</text>

  <g stroke="#2f6fb0" stroke-width="1.2" fill="#ffffff">
    <rect x="40" y="52" width="90" height="26" rx="4"/>
    <rect x="40" y="84" width="90" height="26" rx="4"/>
    <rect x="40" y="140" width="90" height="26" rx="4"/>
  </g>
  <g text-anchor="middle">
    <text x="85" y="70">BAM</text>
    <text x="85" y="102">BAM</text>
    <text x="85" y="128" font-weight="bold">⋮</text>
    <text x="85" y="158">BAM</text>
  </g>

  <g stroke="#444444" stroke-width="1.3" fill="none" marker-end="url(#arrow)">
    <line x1="130" y1="65" x2="568" y2="104"/>
    <line x1="130" y1="97" x2="568" y2="107"/>
    <line x1="130" y1="153" x2="568" y2="110"/>
    <line x1="710" y1="107" x2="748" y2="107"/>
  </g>

  <rect x="570" y="72" width="140" height="70" rx="5" fill="#f9d9b8" stroke="#c46a14" stroke-width="1.2"/>
  <text x="640" y="104" text-anchor="middle" font-weight="bold">Calling</text>
  <text x="640" y="122" text-anchor="middle" font-size="12">all samples together</text>

  <rect x="750" y="72" width="125" height="70" rx="5" fill="#f1f1ef" stroke="#6b6b6b" stroke-width="1.2" stroke-dasharray="6 4"/>
  <g text-anchor="middle">
    <text x="812" y="96" font-weight="bold">Refinement/</text>
    <text x="812" y="113" font-weight="bold">imputation</text>
    <text x="812" y="130">(optional)</text>
  </g>

  <!-- ===== psp mode ===== -->
  <rect x="10" y="200" width="880" height="222" rx="8" fill="#fafafa" stroke="#9a9a9a" stroke-width="1.2"/>
  <text x="26" y="226" font-size="15" font-weight="bold">psp mode</text>

  <g stroke="#2f6fb0" stroke-width="1.2" fill="#ffffff">
    <rect x="40" y="245" width="90" height="26" rx="4"/>
    <rect x="40" y="277" width="90" height="26" rx="4"/>
  </g>
  <g stroke="#2f6fb0" stroke-width="1.2" fill="#cfe2f5">
    <rect x="190" y="245" width="80" height="26" rx="4"/>
    <rect x="190" y="277" width="80" height="26" rx="4"/>
  </g>
  <!-- the added sample -->
  <g stroke="#1f4e80" stroke-width="1.2" fill="#2f6fb0">
    <rect x="40" y="343" width="90" height="26" rx="4"/>
    <rect x="190" y="343" width="80" height="26" rx="4"/>
  </g>
  <g text-anchor="middle">
    <text x="85" y="263">BAM</text>
    <text x="85" y="295">BAM</text>
    <text x="85" y="321" font-weight="bold">⋮</text>
    <text x="85" y="361" fill="#ffffff" font-weight="bold">BAM</text>
    <text x="230" y="263">psp</text>
    <text x="230" y="295">psp</text>
    <text x="230" y="321" font-weight="bold">⋮</text>
    <text x="230" y="361" fill="#ffffff" font-weight="bold">psp</text>
  </g>
  <text x="40" y="392" font-size="12" fill="#1f4e80">a sample added later: the only new pileup</text>

  <g stroke="#444444" stroke-width="1.3" fill="none" marker-end="url(#arrow)">
    <line x1="130" y1="258" x2="188" y2="258"/>
    <line x1="130" y1="290" x2="188" y2="290"/>
    <line x1="130" y1="356" x2="188" y2="356"/>
  </g>
  <!-- the psps meet at one point, which feeds parameter estimation and, directly, calling -->
  <g stroke="#444444" stroke-width="1.3" fill="none">
    <line x1="270" y1="258" x2="306" y2="303"/>
    <line x1="270" y1="290" x2="306" y2="303"/>
    <line x1="270" y1="356" x2="306" y2="303"/>
    <path d="M 306 303 L 306 404 L 640 404 L 640 341" marker-end="url(#arrow)"/>
  </g>
  <circle cx="306" cy="303" r="3" fill="#444444"/>
  <g stroke="#444444" stroke-width="1.3" fill="none" marker-end="url(#arrow)">
    <line x1="306" y1="303" x2="338" y2="303"/>
    <line x1="510" y1="303" x2="568" y2="303"/>
    <line x1="710" y1="303" x2="748" y2="303"/>
  </g>

  <rect x="340" y="268" width="170" height="70" rx="5" fill="#fdeedd" stroke="#c46a14" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="425" y="299" text-anchor="middle" font-weight="bold">Parameter estimation</text>
  <text x="425" y="317" text-anchor="middle">(optional)</text>

  <rect x="570" y="268" width="140" height="70" rx="5" fill="#f9d9b8" stroke="#c46a14" stroke-width="1.2"/>
  <text x="640" y="300" text-anchor="middle" font-weight="bold">Calling</text>
  <text x="640" y="318" text-anchor="middle" font-size="12">all samples together</text>

  <rect x="750" y="268" width="125" height="70" rx="5" fill="#f1f1ef" stroke="#6b6b6b" stroke-width="1.2" stroke-dasharray="6 4"/>
  <g text-anchor="middle">
    <text x="812" y="292" font-weight="bold">Refinement/</text>
    <text x="812" y="309" font-weight="bold">imputation</text>
    <text x="812" y="326">(optional)</text>
  </g>
</svg>
